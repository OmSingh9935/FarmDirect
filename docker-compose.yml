version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: farmdirect_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: farmdirect
    ports:
      - "5432:5432"
    volumes:
      - farmdirect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmdirect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmdirect_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/farmdirect?schema=public
      - JWT_SECRET=farmdirect_jwt_super_secret_key_prod_2026_docker
      - CLIENT_URL=http://localhost:3000
      - EMAIL_PROVIDER=console
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmdirect_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  farmdirect_pgdata:
